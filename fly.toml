# fly.toml app configuration file generated for mainote-bot on 2025-05-18T23:15:44+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mainote-bot'
primary_region = 'cdg'

[build]
  dockerfile = "extra/build/dockerfile/production/Dockerfile"

[env]
  PORT = "8080"
  MAINOTE_SERVER_PORT = "8081"
  MAINOTE_SERVER_URL = "http://localhost:8081"

# Main service (Python bot webhook endpoint)
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
