get:
  tags:
    - Integrations
  summary: Get user's integrations
  description: Retrieve a list of integrations for the user with optional filters
  operationId: getIntegrations
  parameters:
    - name: chat_id
      in: query
      required: true
      schema:
        type: string
      description: Telegram chat ID to filter integrations
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum: ["active", "inactive", "error", "pending_auth"]
      description: Filter integrations by status
    - name: app_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Filter integrations by app ID
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
      description: Maximum number of integrations to return
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Number of integrations to skip
  responses:
    "200":
      description: Integrations retrieved successfully
      content:
        application/json:
          schema:
            $ref: "../schema/responses/integrations_list_response.yaml"
    "400":
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "404":
      description: User not found
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"

post:
  tags:
    - Integrations
  summary: Create a new integration
  description: Creates a new integration for the user
  operationId: createIntegration
  requestBody:
    description: Integration object that needs to be created
    required: true
    content:
      application/json:
        schema:
          $ref: "../schema/requests/create_integration_request.yaml"
  responses:
    "201":
      description: Integration created successfully
      content:
        application/json:
          schema:
            $ref: "../schema/responses/integration_response.yaml"
    "400":
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "404":
      description: User or app not found
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml" 