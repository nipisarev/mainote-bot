get:
  tags:
    - Notes
  summary: Get a single note by ID
  description: Retrieves a specific note by ID for the authenticated user.
  operationId: getNoteById
  parameters:
    - name: note_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Note ID
    - name: chat_id
      in: query
      required: true
      schema:
        type: string
      description: Telegram chat ID for user authorization
  responses:
    "200":
      description: Note retrieved successfully
      content:
        application/json:
          schema:
            $ref: "../schema/responses/note_response.yaml"
    "400":
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "404":
      description: Note not found
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"

put:
  tags:
    - Notes
  summary: Update a note
  description: Updates an existing note for the authenticated user.
  operationId: updateNote
  parameters:
    - name: note_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Note ID
    - name: chat_id
      in: query
      required: true
      schema:
        type: string
      description: Telegram chat ID for user authorization
  requestBody:
    description: Note update data
    required: true
    content:
      application/json:
        schema:
          $ref: "../schema/requests/update_note_request.yaml"
  responses:
    "200":
      description: Note updated successfully
      content:
        application/json:
          schema:
            $ref: "../schema/responses/note_response.yaml"
    "400":
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "404":
      description: Note not found
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"

delete:
  tags:
    - Notes
  summary: Delete a note
  description: Soft deletes a note for the authenticated user.
  operationId: deleteNote
  parameters:
    - name: note_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Note ID
    - name: chat_id
      in: query
      required: true
      schema:
        type: string
      description: Telegram chat ID for user authorization
  responses:
    "204":
      description: Note deleted successfully
    "400":
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "404":
      description: Note not found
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
