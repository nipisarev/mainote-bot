get:
  tags:
    - Notes
  summary: Get notes for user by chat_id
  description: Retrieves a list of notes for the user associated with the chat_id.
  operationId: getNotes
  parameters:
    - name: chat_id
      in: query
      required: true
      schema:
        type: string
      description: Telegram chat ID to filter notes
    - name: category
      in: query
      required: false
      schema:
        type: string
      description: Filter notes by category
    - name: status
      in: query
      required: false
      schema:
        type: string
        default: "active"
      description: Filter notes by status
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
      description: Maximum number of notes to return
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Number of notes to skip
  responses:
    "200":
      description: Notes retrieved successfully
      content:
        application/json:
          schema:
            $ref: "../schema/responses/notes_list_response.yaml"
    "400":
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "404":
      description: User not found
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"

post:
  tags:
    - Notes
  summary: Create a new note
  description: Creates a new note for the user.
  operationId: createNote
  requestBody:
    description: Note object that needs to be created
    required: true
    content:
      application/json:
        schema:
          $ref: "../schema/requests/create_note_request.yaml"
  responses:
    "201":
      description: Note created successfully
      content:
        application/json:
          schema:
            $ref: "../schema/responses/note_response.yaml"
    "400":
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "404":
      description: User not found
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
