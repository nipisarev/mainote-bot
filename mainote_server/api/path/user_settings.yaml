post:
  tags:
    - Users
  summary: Create user settings
  description: Creates new user settings for a given chat_id.
  operationId: createUserSettings
  requestBody:
    description: User settings to create
    required: true
    content:
      application/json:
        schema:
          $ref: "../schema/requests/user_settings_request.yaml"
  responses:
    "201":
      description: User settings created successfully
      content:
        application/json:
          schema:
            $ref: "../schema/responses/user_settings_response.yaml"
    "400":
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "404":
      description: User not found
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"

patch:
  tags:
    - Users
  summary: Update user settings
  description: Updates user settings. Only provided fields will be updated, other fields remain unchanged.
  operationId: updateUserSettings
  parameters:
    - name: chat_id
      in: path
      required: true
      description: Chat ID of the user whose settings to update
      schema:
        type: string
  requestBody:
    description: User settings to update
    required: true
    content:
      application/json:
        schema:
          $ref: "../schema/requests/user_settings_request.yaml"
  responses:
    "200":
      description: User settings updated successfully
      content:
        application/json:
          schema:
            $ref: "../schema/responses/user_settings_response.yaml"
    "400":
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "404":
      description: User not found
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../schema/components/error_response.yaml"
