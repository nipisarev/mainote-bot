type: object
properties:
  chat_id:
    type: string
    description: Telegram chat ID for the user
    example: "123456789"
  email:
    type: string
    format: email
    description: User's email address
    example: "user@example.com"
  password:
    type: string
    format: password
    description: User's password
    minLength: 6
required:
  - chat_id
  - email
  - password
