type: object
properties:
  morning_notification_time:
    type: string
    description: Morning notification time in HH:MM format (e.g., "08:00")
    pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
    example: "08:00"
  timezone:
    type: string
    description: User's timezone (e.g., "UTC", "America/New_York", "Europe/London")
    example: "UTC"
description: |
  Request body for updating user settings. All fields are optional.
  Only provided fields will be updated, others remain unchanged.
