type: object
properties:
  user_id:
    type: string
    format: uuid
    description: Unique identifier for the user
  email:
    type: string
    format: email
    description: User's email address
  chat_id:
    type: string
    description: Telegram chat ID associated with the user
  created_at:
    type: string
    format: date-time
    description: When the user was created
  updated_at:
    type: string
    format: date-time
    description: When the user was last updated
required:
  - user_id
  - email
  - chat_id
  - created_at
  - updated_at
