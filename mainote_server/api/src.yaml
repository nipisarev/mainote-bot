openapi: 3.0.3
info:
  title: Mainote Server API
  description: |
    REST API for Mainote Server - a note management service.
    
    This API provides CRUD operations for managing notes with support for:
    - Creating, reading, updating, and deleting notes
    - Filtering by category, status, and chat ID
    - Pagination for large result sets
    - Rich metadata support using JSON
    
    ## Authentication
    Currently no authentication is required (development mode).
    
    ## Rate Limiting
    No rate limiting is currently implemented.
    
  version: "1.0.0"
  contact:
    name: Mainote Team
    email: support@mainote.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8081
    description: Development server
  - url: https://mainote-server.fly.dev
    description: Production server

paths:
  # Health check endpoint
  /health:
    $ref: 'path/health.yaml'
  /api/v1/users:
    $ref: 'path/users.yaml'
  /api/v1/user/settings:
    $ref: 'path/user_settings.yaml'
  /api/v1/users/chat/{chat_id}:
    $ref: 'path/user_by_chat_id.yaml'
  /api/v1/auth:
    $ref: 'path/auth.yaml'
  /api/v1/apps:
    $ref: 'path/apps.yaml'

components:
  
  responses:
    BadRequest:
      $ref: 'schema/responses/bad_request.yaml'
    NotFound:
      $ref: 'schema/responses/not_found.yaml'
    InternalServerError:
      $ref: 'schema/responses/internal_server_error.yaml'
    ServiceUnavailable:
      $ref: 'schema/responses/service_unavailable.yaml'

tags:
  - name: Health
    description: Health check operations
  - name: Users
    description: User management operations
  - name: Apps
    description: App management operations for customer installations

